[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermesvoice-agent"
version = "0.1.0"
description = "HermesVoice agent: gives RimWorld colonists their minds"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hermesvoice-agent = "hermesvoice_agent.cli:main"

[tool.setuptools.packages.find]
include = ["hermesvoice_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a live llama-server (HERMESVOICE_TEST_LLM_URL); skipped by default"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rimworldllm-agent"
version = "0.1.0"
description = "RimWorldLLM agent: a game-agnostic engine that gives characters their minds (RimWorld adapter included)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rimworldllm-agent = "rimworldllm_agent.cli:main"

[tool.setuptools.packages.find]
include = ["rimworldllm_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a live llama-server (RIMWORLDLLM_TEST_LLM_URL); skipped by default"]

[tool.setuptools.package-data]
"rimworldllm_agent.games.rimworld" = ["block_a.txt", "steward_system.txt", "steward_strategy.txt"]
